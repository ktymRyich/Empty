name: Deploy to GitHub Pages

# Builds every project in the repo into a single Pages artifact:
#   particle-ecosystem -> site root   (/<repo>/)            URL unchanged
#   island-vacation    -> subpath     (/<repo>/island-vacation/)
# Each project keeps its own deps/build; only the published layout is shared
# (GitHub Pages allows one site per repo).

on:
  push:
    branches:
      - main
      - claude/start-planmd-implementation-PKYPZ
      - claude/game-design-island-exploration-nZstc
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            particle-ecosystem/package-lock.json
            island-vacation/package-lock.json

      # --- particle-ecosystem -> site root ---
      - name: Build particle-ecosystem
        working-directory: particle-ecosystem
        env:
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build

      # --- island-vacation -> /island-vacation/ subpath ---
      - name: Build island-vacation
        working-directory: island-vacation
        env:
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/island-vacation/
        run: |
          npm ci
          npm run build

      # --- assemble combined site ---
      - name: Assemble site
        run: |
          rm -rf _site
          mkdir -p _site/island-vacation
          cp -r particle-ecosystem/dist/. _site/
          cp -r island-vacation/dist/. _site/island-vacation/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
