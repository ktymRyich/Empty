<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Island Vacation — 島まるごと探索</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #aee4ff;
        color: #234;
        font-family: system-ui, -apple-system, 'Helvetica Neue', sans-serif;
        overflow: hidden;
      }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }
      #hud {
        position: fixed;
        top: 8px;
        left: 8px;
        padding: 6px 10px;
        font-size: 12px;
        color: #0a3a4a;
        background: rgba(255, 255, 255, 0.45);
        border: 1px solid rgba(40, 120, 160, 0.25);
        border-radius: 6px;
        pointer-events: none;
        user-select: none;
        line-height: 1.5;
      }
      #help {
        position: fixed;
        bottom: 8px;
        left: 8px;
        padding: 6px 10px;
        font-size: 12px;
        color: #0a3a4a;
        background: rgba(255, 255, 255, 0.45);
        border: 1px solid rgba(40, 120, 160, 0.25);
        border-radius: 6px;
        pointer-events: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div><strong>Island Vacation</strong></div>
      <div id="hud-stats"></div>
    </div>
    <div id="help">WASD / 矢印キーで移動</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
