<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Particle Ecosystem — Cosmic Simulator</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000010;
        color: #cfe;
        font-family: system-ui, -apple-system, 'Helvetica Neue', sans-serif;
        overflow: hidden;
      }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }
      #hud {
        position: fixed;
        top: 8px;
        left: 8px;
        padding: 6px 10px;
        font-size: 12px;
        color: #9ff;
        background: rgba(0, 0, 20, 0.35);
        border: 1px solid rgba(120, 200, 255, 0.2);
        border-radius: 4px;
        pointer-events: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div>Particle Ecosystem</div>
      <div id="hud-stats"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
